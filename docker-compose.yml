services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cube_solver
      POSTGRES_USER: cube_solver
      POSTGRES_PASSWORD: cube_solver
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cube_solver -d cube_solver"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - cube-solver-postgres:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cube_solver:cube_solver@postgres:5432/cube_solver
      ADMIN_EMAIL: admin@admin.com
      SERVER_PORT: 8080
      JAVA_OPTS: -Dserver.cors.origin=http://localhost:8080 -Dserver.cookie.secure=false
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    develop:
      watch:
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./frontend
        - action: rebuild
          path: ./pom.xml
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./docker-compose.yml

volumes:
  cube-solver-postgres:

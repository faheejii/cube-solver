name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cube_solver_test
          POSTGRES_USER: cube_solver
          POSTGRES_PASSWORD: cube_solver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cube_solver -d cube_solver_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://cube_solver:cube_solver@localhost:5432/cube_solver_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -q -Dmaven.compiler.useIncrementalCompilation=false -Df2l.corpus=true test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/docker-smoke-test.sh
      - run: ./scripts/docker-smoke-test.sh
